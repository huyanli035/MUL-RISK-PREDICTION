<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老年髋部骨折术后营养不良风险计算器（二分类）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background-color: #f0f5f9; }
        .container { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h2 { color: #1e4663; border-left: 5px solid #2c7da0; padding-left: 15px; margin-bottom: 15px; }
        .desc { background: #eef3fc; padding: 12px 18px; border-radius: 12px; margin-bottom: 25px; line-height: 1.6; font-size: 14px; }
        .input-group { margin: 15px 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        label { width: 200px; font-size: 14px; font-weight: 500; color: #1f3b4c; }
        input, select { padding: 8px 12px; width: 200px; border: 1px solid #bbb; border-radius: 8px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #2c7da0; }
        .hint { font-size: 11px; background: #eef2f7; padding: 2px 8px; border-radius: 20px; color: #2c5a74; white-space: nowrap; }
        button { background: #2c7da0; color: white; border: none; padding: 10px 28px; font-size: 16px; border-radius: 40px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:hover { background: #1f6392; }
        #result { margin-top: 30px; padding: 20px; background: #fefefe; border-radius: 20px; border: 1px solid #dce5ec; }
        .prob { font-size: 26px; font-weight: bold; margin-bottom: 8px; }
        .level { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
        .note { font-size: 12px; color: #6c7a89; background: #f9fbfd; padding: 10px; border-radius: 14px; margin-top: 12px; }
        @media (max-width: 700px) { label { width: 100%; } input, select { width: 100%; } .hint { white-space: normal; } }
    </style>
</head>
<body>
<div class="container">
    <h2>🦴 老年髋部骨折术后营养不良风险计算器</h2>
    <p class="desc">📌 基于四项核心指标评估术后营养不良风险，<strong>风险分为两阶段</strong>：概率 < 0.15 为低风险，≥ 0.15 为高风险。<br>
    ✨ <strong>赋值规则</strong>：合并症 >4 → 1；出血量 >100 ml → 1；白蛋白 <35 g/L → 1；血红蛋白（男<120，女<110 g/L）→ 1；其余为 0。</p>
    <div style="display:flex; flex-direction:column; gap:5px;">
        <div class="input-group"><label>性别：</label><select id="gender"><option value="0">男性</option><option value="1">女性</option></select></div>
        <div class="input-group"><label>合并症数量（个数）：</label><input type="number" id="comorbidity" step="any" placeholder="输入个数"></div>
        <div class="input-group"><label>术中出血量（ml）：</label><input type="number" id="blood_loss" step="any" value="280" placeholder="毫升"></div>
        <div class="input-group"><label>白蛋白浓度（g/L）：</label><input type="number" id="alb" step="any" value="42" placeholder="正常35-55"></div>
        <div class="input-group"><label>血红蛋白浓度（g/L）：</label><input type="number" id="hb" step="any" value="128" placeholder="正常110-160"></div>
    </div>
    <div style="text-align:center;"><button id="calcBtn">📊 计算术后营养不良风险概率</button></div>
    <div id="result">
        <div class="note">✨ 填写数据后点击按钮，获取预测概率及风险等级。</div>
    </div>
</div>
<script>
    (function() {
        var calcBtn = document.getElementById("calcBtn");
        var resultDiv = document.getElementById("result");
        function getFloat(id, defaultValue) {
            var element = document.getElementById(id);
            if (!element) return defaultValue;
            var v = parseFloat(element.value);
            return isNaN(v) ? defaultValue : v;
        }
        function getInt(id, defaultValue) {
            var element = document.getElementById(id);
            if (!element) return defaultValue;
            var v = parseInt(element.value);
            return isNaN(v) ? defaultValue : v;
        }
        function computeRisk() {
            var comorbidity = getFloat("comorbidity", 0);
            var blood_loss = getFloat("blood_loss", 0);
            var alb_val = getFloat("alb", 42);
            var hb_val = getFloat("hb", 130);
            var gender = getInt("gender", 0);

            var binComorbidity = (comorbidity > 4) ? 1 : 0;
            var binBloodLoss = (blood_loss > 100) ? 1 : 0;
            var binAlb = (alb_val < 35) ? 1 : 0;
            var binHb;
            if (gender === 0) { binHb = (hb_val < 120) ? 1 : 0; }
            else { binHb = (hb_val < 110) ? 1 : 0; }

            var total = binComorbidity * 0.808 + binBloodLoss * 0.666 + binAlb * 0.726 + binHb * 1.074;
            var MAX_TOTAL = 0.808 + 0.666 + 0.726 + 1.074;
            if (total < 0) total = 0;
            var prob = total / MAX_TOTAL;
            if (prob > 1) prob = 1;
            var percent = (prob * 100).toFixed(2);

            // 两阶段风险分级（界值 0.15）
            var levelText, color;
            if (prob < 0.15) {
                levelText = "🔵 低风险";
                color = "#1f8a4c";
            } else {
                levelText = "🔴 高风险";
                color = "#c0392b";
            }

            var detailHtml = "<div class=\"detail-status\" style=\"background:#f4f9fe; border-radius:16px; padding:10px 14px; margin:15px 0 8px; font-size:12px; line-height:1.5; color:#1e4663;\">✅ 基于四项指标计算，风险分数 = " + total.toFixed(2) + " / " + MAX_TOTAL.toFixed(2) + "</div>";
            resultDiv.innerHTML = 
                "<div class=\"prob\" style=\"color:" + color + "\">📈 术后营养不良预测概率：" + percent + "%</div>" +
                "<div class=\"level\" style=\"color:" + color + "\">⚠️ 风险分级：" + levelText + "</div>" +
                detailHtml +
                "<div class=\"note\">📚 仅供临床科研参考，不能替代医师判断。</div>";
        }

        if (calcBtn) {
            calcBtn.onclick = function(e) {
                e.preventDefault();
                computeRisk();
            };
        }

        if (window.addEventListener) {
            window.addEventListener("DOMContentLoaded", function() { computeRisk(); });
        } else {
            window.attachEvent("onload", function() { computeRisk(); });
        }
    })();
</script>
</body>
</html>
